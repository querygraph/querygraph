[package]
name = "querygraph"
version = "0.5.1"
edition = "2024"
description = "AI Navigator semantic layer for governed dataset discovery and reuse"
license = "MIT"
repository = "https://github.com/querygraph/querygraph"
homepage = "https://querygraph.ai"
exclude = ["docs/**", "benchmarks/**", "scripts/**", "target/**", "demo/pinax/dist/**"]

[dependencies]
anyhow = "1.0"
arrow = "58.3.0"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
bs58 = "0.5"
calamine = "0.28"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
csv = "1.3"
ed25519-dalek = "2"
pinax = { package = "pinax-registry", version = "0.2.0" }
futures-util = "0.3"
grust = { package = "grust-graph", version = "0.13.0", features = ["sail"] }
grust-cypher = { version = "0.13.0" }
marciana-cognition = { version = "0.13.1" }
querygraph-memory = { version = "0.13.1", features = ["sail"] }
qglake-bundle = { version = "0.4.0" }
lakecat-core = { version = "0.4.0" }
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "process", "io-util"] }
typesec-agent = "0.14.0"
typesec-core = "0.14.0"
typesec-integrations = "0.14.0"
typesec-memory = { version = "0.14.0", features = ["agent"] }
typesec-rbac = { version = "0.14.0", default-features = false }
uuid = { version = "1", features = ["v4", "v5"] }
zeroize = "1"

[dev-dependencies]
http-body-util = "0.1"
marciana-cognition = { version = "0.13.1", features = ["test-support"] }
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
