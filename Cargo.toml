[package]
name = "querygraph"
version = "0.4.2"
edition = "2024"
description = "AI Navigator semantic layer for governed dataset discovery and reuse"
license = "MIT"
repository = "https://github.com/querygraph/querygraph"
homepage = "https://querygraph.ai"
exclude = ["docs/**", "benchmarks/**", "scripts/**", "target/**"]

[dependencies]
anyhow = "1.0"
arrow = "58.3.0"
async-trait = "0.1"
axum = "0.8"
bs58 = "0.5"
calamine = "0.28"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
csv = "1.3"
ed25519-dalek = "2"
grust = { package = "grust-graph", version = "0.12.1", features = ["sail"] }
grust-cypher = { version = "0.12.1" }
marciana-cognition = { version = "0.12.1" }
querygraph-memory = { version = "0.12.1", features = ["sail"] }
qglake-bundle = { version = "0.3.0" }
lakecat-core = { version = "0.3.0" }
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
typesec-agent = "0.13.1"
typesec-core = "0.13.1"
typesec-integrations = "0.13.1"
typesec-memory = { version = "0.13.1", features = ["agent"] }
typesec-rbac = { version = "0.13.1", default-features = false }
uuid = { version = "1", features = ["v5"] }

[dev-dependencies]
http-body-util = "0.1"
marciana-cognition = { version = "0.12.1", features = ["test-support"] }
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
